# ==============================================================================
# Lenny Growth Assistant - Docker Compose
# ==============================================================================
# One-command startup: docker compose up
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lenny-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Valikala@1
      POSTGRES_DB: lenny_growth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # FastAPI Backend
  # --------------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: lenny-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Valikala%401@postgres:5432/lenny_growth
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - APP_ENV=production
      - DEBUG=false
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - ./data/transcripts:/app/data/transcripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Frontend (React SPA)
  # --------------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: lenny-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  chroma_data:
    driver: local
